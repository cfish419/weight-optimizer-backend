<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BalanceIQ Supervisor</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .super-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
    .bay{border:1px solid #e5e7eb;border-radius:12px;padding:12px;background:#fff}
    .bay h3{margin:0 0 8px 0}
    .zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .cell{border:1px solid #e5e7eb;border-radius:10px;padding:8px;background:#fafafa}
    .row{display:flex;gap:8px;align-items:center}
    .bar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin-top:6px}
    .fill{height:100%;width:0%}
    .fill.red{background:var(--red)}
    .fill.yellow{background:var(--yellow)}
    .fill.blue{background:var(--blue)}
    .meta{font-size:12px;color:#64748b}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #e5e7eb;border-radius:999px;padding:4px 10px;font-size:12px;color:#334155}
  </style>
</head>
<body>
<header class="header">
  <img src="/assets/images/southwest_logo.png" alt="Southwest logo">
  <div class="brand-text">| BalanceIQ Supervisor</div>
  <a href="/" class="hdr-link">Loader</a>
</header>

<main class="container">
  <h1>Supervisor</h1>
  <p class="sub">Live snapshot from Loader, or choose a flight to load a flight-specific snapshot (legacy snapshots are auto-rebuilt with center-first loading).</p>

  <div class="card">
    <div class="controls" style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="sync-btn" class="secondary">Sync now</button>
      <a id="clear-cache" class="ghost">Clear cached snapshot</a>
      <select id="super-flight-select" style="min-width:260px">
        <option value="">Loader Snapshot (default)</option>
      </select>
      <div id="snap-pill" class="pill">No snapshot yet</div>
    </div>
    <div id="last-upd" class="meta" style="margin-top:6px"></div>
    <div id="summary" class="meta" style="margin-top:6px"></div>
  </div>

  <div class="super-grid">
    <div class="bay">
      <h3>FWD</h3>
      <div class="zones">
        <div class="cell"><div class="row"><strong>L1</strong><span class="meta" id="FWD.LEFT.1-meta"></span></div><div class="bar"><div class="fill red" id="FWD.LEFT.1"></div></div></div>
        <div class="cell"><div class="row"><strong>L2</strong><span class="meta" id="FWD.LEFT.2-meta"></span></div><div class="bar"><div class="fill yellow" id="FWD.LEFT.2"></div></div></div>
        <div class="cell"><div class="row"><strong>L3</strong><span class="meta" id="FWD.LEFT.3-meta"></span></div><div class="bar"><div class="fill blue" id="FWD.LEFT.3"></div></div></div>

        <div class="cell"><div class="row"><strong>R1</strong><span class="meta" id="FWD.RIGHT.1-meta"></span></div><div class="bar"><div class="fill red" id="FWD.RIGHT.1"></div></div></div>
        <div class="cell"><div class="row"><strong>R2</strong><span class="meta" id="FWD.RIGHT.2-meta"></span></div><div class="bar"><div class="fill yellow" id="FWD.RIGHT.2"></div></div></div>
        <div class="cell"><div class="row"><strong>R3</strong><span class="meta" id="FWD.RIGHT.3-meta"></span></div><div class="bar"><div class="fill blue" id="FWD.RIGHT.3"></div></div></div>
      </div>
    </div>

    <div class="bay">
      <h3>AFT</h3>
      <div class="zones">
        <div class="cell"><div class="row"><strong>L1</strong><span class="meta" id="AFT.LEFT.1-meta"></span></div><div class="bar"><div class="fill red" id="AFT.LEFT.1"></div></div></div>
        <div class="cell"><div class="row"><strong>L2</strong><span class="meta" id="AFT.LEFT.2-meta"></span></div><div class="bar"><div class="fill yellow" id="AFT.LEFT.2"></div></div></div>
        <div class="cell"><div class="row"><strong>L3</strong><span class="meta" id="AFT.LEFT.3-meta"></span></div><div class="bar"><div class="fill blue" id="AFT.LEFT.3"></div></div></div>

        <div class="cell"><div class="row"><strong>R1</strong><span class="meta" id="AFT.RIGHT.1-meta"></span></div><div class="bar"><div class="fill red" id="AFT.RIGHT.1"></div></div></div>
        <div class="cell"><div class="row"><strong>R2</strong><span class="meta" id="AFT.RIGHT.2-meta"></span></div><div class="bar"><div class="fill yellow" id="AFT.RIGHT.2"></div></div></div>
        <div class="cell"><div class="row"><strong>R3</strong><span class="meta" id="AFT.RIGHT.3-meta"></span></div><div class="bar"><div class="fill blue" id="AFT.RIGHT.3"></div></div></div>
      </div>
    </div>
  </div>
</main>

<script>
  const LATEST_KEY = 'balanceiq-supervisor';
  const flightKey = (fn)=> `balanceiq-supervisor:${fn}`;

  async function fetchFlightData(){
    try{
      const res = await fetch('/assets/data/mock_flight_data.json', {cache:'no-cache'});
      return await res.json();
    }catch(e){ console.warn('flight data fetch failed', e); return null; }
  }

  function read(key){ try{ return JSON.parse(localStorage.getItem(key)||'null'); }catch(e){ return null; } }
  function write(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  // ---- Center-first flight snapshot from manifest (fallback or rebuild) ----
  function computeSnapshotFromManifest(man){
    if(!man) return null;
    const kg2lb = kg=>kg*2.20462;
    const cells = {
      'FWD.LEFT.1':{count:0, weightLb:0}, 'FWD.RIGHT.1':{count:0, weightLb:0},
      'FWD.LEFT.2':{count:0, weightLb:0}, 'FWD.RIGHT.2':{count:0, weightLb:0},
      'FWD.LEFT.3':{count:0, weightLb:0}, 'FWD.RIGHT.3':{count:0, weightLb:0},
      'AFT.LEFT.1':{count:0, weightLb:0}, 'AFT.RIGHT.1':{count:0, weightLb:0},
      'AFT.LEFT.2':{count:0, weightLb:0}, 'AFT.RIGHT.2':{count:0, weightLb:0},
      'AFT.LEFT.3':{count:0, weightLb:0}, 'AFT.RIGHT.3':{count:0, weightLb:0},
    };
    const order = {FWD:[3,2,1], AFT:[1,2,3]}; // center-first
    const areaW = {FWD:0, AFT:0};
    const zoneW = {FWD:{1:0,2:0,3:0}, AFT:{1:0,2:0,3:0}};
    const rr = {'FWD.1':'LEFT','FWD.2':'LEFT','FWD.3':'LEFT','AFT.1':'LEFT','AFT.2':'LEFT','AFT.3':'LEFT'};
    const flip = s => s === 'LEFT' ? 'RIGHT' : 'LEFT';

    const checked = (man.baggage||[]).filter(b=>b.status==='CHECKED_IN').slice()
      .sort((a,b)=> (b.weight_kg||0)-(a.weight_kg||0)); // heavy first

    let totalLb = 0;
    for(const b of checked){
      const lb = kg2lb(Number(b.weight_kg||0));
      totalLb += lb;

      // send to lighter hold
      const area = areaW.FWD <= areaW.AFT ? 'FWD' : 'AFT';

      // pick zone with least weight (tie → center-first)
      let chosen = order[area][0], best = Infinity;
      for(const z of order[area]){
        const w = zoneW[area][z];
        if(w < best){ best = w; chosen = z; }
      }

      const key = `${area}.${chosen}`;
      const side = rr[key]; rr[key] = flip(side);

      const cellKey = `${area}.${side}.${chosen}`;
      cells[cellKey].count += 1;
      cells[cellKey].weightLb += lb;

      areaW[area] += lb;
      zoneW[area][chosen] += lb;
    }

    return {
      version: 4,
      perCellCap: 20,
      ts: Date.now(),
      flightNumber: man.flight?.flight_number || null,
      totals: { bags: checked.length, weightLb: totalLb },
      cells
    };
  }

  // If cached snapshot is missing or legacy (v<4), rebuild it
  function getFlightSnapshot(fn, data){
    const cached = read(flightKey(fn));
    if(cached && Number(cached.version) >= 4) return cached;
    const man = (data?.manifests||[]).find(m => m.flight?.flight_number === fn);
    const snap = computeSnapshotFromManifest(man);
    if(snap) write(flightKey(fn), snap);
    return snap;
  }

  function setCell(area, side, zone, bags, weight, maxW){
    const fill = document.getElementById(`${area}.${side}.${zone}`);
    const meta = document.getElementById(`${area}.${side}.${zone}-meta`);
    if(fill) fill.style.width = Math.max(0, Math.min(100, Math.round((weight||0)/(maxW||1)*100))) + '%';
    if(meta) meta.textContent = `${bags||0} • ${Math.round(weight||0)} lb`;
  }

  function renderSnapshot(snap, rebuiltNote){
    const lu = document.getElementById('last-upd');
    const sum = document.getElementById('summary');
    const pill = document.getElementById('snap-pill');

    if(!snap){
      if(lu) lu.textContent = 'No snapshot';
      if(sum) sum.textContent = '';
      if(pill) pill.textContent = 'No snapshot';
      Array.from(document.querySelectorAll('.fill')).forEach(el=> el.style.width='0%');
      Array.from(document.querySelectorAll('[id$="-meta"]')).forEach(el=> el.textContent='');
      return;
    }
    const rebuilt = rebuiltNote ? ' • rebuilt v4' : '';
    if(lu) lu.textContent = `Last update: ${new Date(snap.ts||Date.now()).toLocaleTimeString()} ${snap.flightNumber? '• Flight '+snap.flightNumber : ''}${rebuilt}`;
    if(sum) sum.textContent = `${snap.totals?.bags||0} bags • ${Math.round(Number(snap.totals?.weightLb||0))} lb`;
    if(pill) pill.textContent = snap.flightNumber ? `Snapshot: ${snap.flightNumber}` : 'Snapshot: latest';

    const weights = Object.values(snap.cells||{}).map(c=>c.weightLb||0);
    const maxW = Math.max(1, ...weights);

    setCell('FWD','LEFT',1, snap.cells['FWD.LEFT.1']?.count,  snap.cells['FWD.LEFT.1']?.weightLb,  maxW);
    setCell('FWD','LEFT',2, snap.cells['FWD.LEFT.2']?.count,  snap.cells['FWD.LEFT.2']?.weightLb,  maxW);
    setCell('FWD','LEFT',3, snap.cells['FWD.LEFT.3']?.count,  snap.cells['FWD.LEFT.3']?.weightLb,  maxW);
    setCell('FWD','RIGHT',1, snap.cells['FWD.RIGHT.1']?.count, snap.cells['FWD.RIGHT.1']?.weightLb, maxW);
    setCell('FWD','RIGHT',2, snap.cells['FWD.RIGHT.2']?.count, snap.cells['FWD.RIGHT.2']?.weightLb, maxW);
    setCell('FWD','RIGHT',3, snap.cells['FWD.RIGHT.3']?.count, snap.cells['FWD.RIGHT.3']?.weightLb, maxW);

    setCell('AFT','LEFT',1, snap.cells['AFT.LEFT.1']?.count,  snap.cells['AFT.LEFT.1']?.weightLb,  maxW);
    setCell('AFT','LEFT',2, snap.cells['AFT.LEFT.2']?.count,  snap.cells['AFT.LEFT.2']?.weightLb,  maxW);
    setCell('AFT','LEFT',3, snap.cells['AFT.LEFT.3']?.count,  snap.cells['AFT.LEFT.3']?.weightLb,  maxW);
    setCell('AFT','RIGHT',1, snap.cells['AFT.RIGHT.1']?.count, snap.cells['AFT.RIGHT.1']?.weightLb, maxW);
    setCell('AFT','RIGHT',2, snap.cells['AFT.RIGHT.2']?.count, snap.cells['AFT.RIGHT.2']?.weightLb, maxW);
    setCell('AFT','RIGHT',3, snap.cells['AFT.RIGHT.3']?.count, snap.cells['AFT.RIGHT.3']?.weightLb, maxW);
  }

  (async function init(){
    const data = await fetchFlightData();
    const sel = document.getElementById('super-flight-select');
    if(sel && data?.flights){
      for(const f of data.flights.slice().sort((a,b)=> a.flight_number.localeCompare(b.flight_number))){
        const o = document.createElement('option');
        o.value = f.flight_number;
        o.textContent = `${f.flight_number} (${f.departure}→${f.arrival})`;
        sel.appendChild(o);
      }
    }

    // Initial render = latest snapshot
    renderSnapshot(read(LATEST_KEY));

    sel?.addEventListener('change', (e)=>{
      const fn = e.target.value;
      if(!fn){ renderSnapshot(read(LATEST_KEY)); return; }
      const cached = read(flightKey(fn));
      if(!cached || Number(cached.version) < 4){
        const snap = getFlightSnapshot(fn, data);
        renderSnapshot(snap, true);
      }else{
        renderSnapshot(cached, false);
      }
    });

    document.getElementById('sync-btn')?.addEventListener('click', ()=>{
      const fn = sel?.value || '';
      if(fn){
        const cached = read(flightKey(fn));
        if(!cached || Number(cached.version) < 4){
          const snap = getFlightSnapshot(fn, data);
          renderSnapshot(snap, true);
        }else{
          renderSnapshot(cached, false);
        }
      }else{
        renderSnapshot(read(LATEST_KEY));
      }
    });

    document.getElementById('clear-cache')?.addEventListener('click', ()=>{
      const fn = sel?.value || '';
      if(fn){ localStorage.removeItem(flightKey(fn)); renderSnapshot(null); }
      else { localStorage.removeItem(LATEST_KEY); renderSnapshot(null); }
    });

    // Cross-tab updates from loader
    window.addEventListener('storage', (ev)=>{
      const fn = sel?.value || '';
      if(fn && ev.key === flightKey(fn)) renderSnapshot(read(flightKey(fn)));
      if(!fn && ev.key === LATEST_KEY)   renderSnapshot(read(LATEST_KEY));
    });
  })();
</script>
</body>
</html>
