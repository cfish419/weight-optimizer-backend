version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://weight_user:weight_pass@database:5432/weight_optimizer
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weight-optimizer-network

  # Frontend service (BalanceIQ Baggage Demo)
  frontend:
    build:
      context: ../balanceiq_baggage_demo
      dockerfile: Dockerfile
    ports:
      - "3000:5050"  # Map host 3000 to container 5050
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - weight-optimizer-network

  # PostgreSQL database
  database:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=weight_optimizer
      - POSTGRES_USER=weight_user
      - POSTGRES_PASSWORD=weight_pass
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weight_user -d weight_optimizer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - weight-optimizer-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - weight-optimizer-network



volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  weight-optimizer-network:
    driver: bridge