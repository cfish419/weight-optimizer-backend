name: Infrastructure CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'infrastructure/**'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/**'

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0
  # AWS Account ID - set in repository secrets
  # AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  # Terraform Validation and Planning
  terraform-plan:
    runs-on: ubuntu-latest
    outputs:
      plan-output: ${{ steps.plan.outputs.stdout }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          
      - name: Terraform Format Check
        run: |
          cd infrastructure/terraform
          terraform fmt -check -recursive
          
      - name: Run TFLint
        run: |
          cd infrastructure/terraform
          tflint --init
          find . -name "*.tf" -exec dirname {} \; | sort -u | while read dir; do
            echo "Linting $dir"
            (cd "$dir" && tflint)
          done

      - name: Terraform Init
        run: |
          cd infrastructure/terraform/environments/production
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=weight-optimizer/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        run: |
          cd infrastructure/terraform/environments/production
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          cd infrastructure/terraform/environments/production
          terraform plan -no-color -out=tfplan \
            -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="deployment_role_arn=${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}"
        continue-on-error: true

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/terraform/environments/production/tfplan

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            
            <details><summary>Show Plan</summary>
            
            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # Security and Compliance Scanning
  terraform-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          config_file: .checkov.yml
          quiet: true
          soft_fail: true

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: checkov-results.sarif
        continue-on-error: true
          
      - name: Run Prisma Cloud scan
        if: github.event_name == 'pull_request'
        run: |
          # Install Prisma Cloud CLI (if available)
          # For demo, we'll use the existing Checkov results
          echo "Prisma Cloud scan would run here in enterprise environment"
          echo "Using Checkov results as baseline security scan"
          
          # Run additional security scans
          pip install safety
          safety check --json --output safety-report.json || true

      - name: Run TFSec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform
          soft_fail: true

  # Cost estimation
  terraform-cost:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost estimate
        run: |
          cd infrastructure/terraform/environments/production
          infracost breakdown --path . --format json --out-file infracost.json

      - name: Post Infracost comment
        run: |
          infracost comment github --path infracost.json \
            --repo ${{ github.repository }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --pull-request ${{ github.event.pull_request.number }}

  # Apply Infrastructure (Production)
  terraform-apply:
    needs: [terraform-plan, terraform-security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production-infrastructure
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/terraform/environments/production/

      - name: Terraform Init
        run: |
          cd infrastructure/terraform/environments/production
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=weight-optimizer/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        run: |
          cd infrastructure/terraform/environments/production
          terraform apply -auto-approve tfplan
          
      - name: Validate Deployment
        run: |
          # Verify resources were created in correct account
          CURRENT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          EXPECTED_ACCOUNT="${{ secrets.AWS_ACCOUNT_ID }}"
          
          if [ "$CURRENT_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "ERROR: Deployed to wrong account. Expected: $EXPECTED_ACCOUNT, Got: $CURRENT_ACCOUNT"
            exit 1
          fi
          
          echo "✅ Successfully deployed to account: $CURRENT_ACCOUNT"

      - name: Store Infrastructure Outputs
        run: |
          cd infrastructure/terraform/environments/production
          
          # Store outputs in SSM for application deployment
          VPC_ID=$(terraform output -raw vpc_id)
          ALB_DNS=$(terraform output -raw alb_dns_name)
          INSTANCE_ID=$(terraform output -raw ec2_instance_id)
          
          aws ssm put-parameter --name "/weight-optimizer/vpc/id" --value "$VPC_ID" --type "String" --overwrite
          aws ssm put-parameter --name "/weight-optimizer/alb/dns-name" --value "$ALB_DNS" --type "String" --overwrite
          aws ssm put-parameter --name "/weight-optimizer/ec2/instance-id" --value "$INSTANCE_ID" --type "String" --overwrite

  # Staging Infrastructure (for develop branch)
  terraform-apply-staging:
    needs: [terraform-plan, terraform-security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging-infrastructure
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Staging Infrastructure
        run: |
          cd infrastructure/terraform/environments/staging
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=weight-optimizer/staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan